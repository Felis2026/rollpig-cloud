[tool.poetry]
name = "rollpig-cloud"
version = "0.10.2"
description = "Cloud storage service for nonebot-plugin-rollpig"
authors = ["Felis"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.10"
fastapi = ">=0.121.0"
pydantic = ">=2.0.0,<3.0.0"
uvicorn = { version = ">=0.29.0", extras = ["standard"] }
sqlalchemy = ">=2.0.29"
pymysql = ">=1.1.0"
cryptography = ">=42.0.0"

# TestClient 在新旧 Starlette 中分别使用 httpx2 与 httpx。
httpx = { version = ">=0.27.0", optional = true }
httpx2 = { version = ">=2.0.0", optional = true }

[tool.poetry.extras]
test = ["httpx", "httpx2"]

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
